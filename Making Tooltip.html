<!DOCTYPE html>
<html>
  <head>
    <title>Tooltip</title>
    <link rel="stylesheet" href="practic css/Making Tooltip.css">
  </head>
  <body>
    <div class="container">
      <div class="follow-button-container">
        <button class="follow-button">Follow</button>
        <p class="tooltip">follow button</p>
      </div>

      <div class="join-button-container">
        <button class="join-button">JOIN</button>
        <p class="tooltip">join us</p>
      </div>

      <div class="messanger-button-container">
        <div class="messanger-notification-container">
          <img class="messanger-icon" src="thumbnail/messanger icon.png" alt="messanger">
          <p class="notification">15</p>
        </div>
        <p class="tooltip">open messanger</p>
      </div>
    </div>
  </body>
</html>
