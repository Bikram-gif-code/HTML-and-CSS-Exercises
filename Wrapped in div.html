<!DOCTYPE html>
<html>
  <head>
    <title>Div=division element</title>
    <link rel="stylesheet" href="practic css/Wrapped in div.css">
  </head>
  <body>
    <div class="square">
    </div>
    <div class="circle">
    </div>

    <br><br><br><br>

    <div class="service">
      <p>Satisfied with our service?</p>
      <button>Yes</button>
      <button>No</button>
    </div>

    <br><br><br><br>

    <div class="install-youtube">
      <p class="head">install YouTube Music</p>
      <p class="description">
        Add YouTube Music to your desktop for quick and
	easy access
      </p>
    </div>

    <br><br><br><br>

    <div class="tweet-div">
      <p class="tweet-paragraph">
        <img class="small-circle-image" src="thumbnail/code-image.jpg">
        <span>What's happening?</span>
        <button class="tweet">Tweet</button>
      </p>
    </div>

    <br><br><br><br>

    <div class="dog">
      <img class="square-image" src="thumbnail/OIP.jpeg">
      <p class="name">Oliver</p>
      <p class="status">2 mutual friends</p>
      <button class="add-friend">Add Friend</button>
    </div>

    <div class="dog">
      <img class="square-image" src="thumbnail/OIP (1).jpeg">
      <p class="name">Oliver</p>
      <p class="status">2 mutual friends</p>
      <button class="add-friend">Add Friend</button>
    </div>

    <div class="dog">
      <img class="square-image" src="thumbnail/cute dog.webp">
      <p class="name">Oliver</p>
      <p class="status">2 mutual friends</p>
      <button class="add-friend">Add Friend</button>
    </div>

    <div class="google-image"> 
      <img class="google" src="thumbnail/Google-Logo.png"> 
    </div>
    <div class="google-search"> 
      <input class="search" type="text" placeholder="Search Google or type a URL">
     </div>
    
  </body>
</html>
