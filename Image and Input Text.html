<!DOCTYPE html>
<html>
  <head>

    <link rel="stylesheet" href="practic css/Images and Input Text.css">
  </head>
  
  <body>
    <img class="regular-image" src="thumbnail/code-image.jpg">
    <img class="square-image" src="thumbnail/code-image.jpg">
