<!DOCTYPE html>
<html>
  <head>
    <title>Display Property</title>
    <link rel="stylesheet" href="practic css/Display Property.css">
  </head>
  <body>

    <input class="first-input" type="text" placeholder="Name">
    <input class="second-input" type="text" placeholder="Email">
    
    <p>
      Thanks for chatting with our
      customer support. Would you
      like to take our quick survey?
    </p>
    <button>Yes</button>
    <button>No</button>

    <img src="thumbnail/Google-Logo.png">
    <input class="search" type="text" placeholder="Search Google or type a URL">

    <input class="firstname" type="text" placeholder="First Name">
    <input class="firstname" type="text" placeholder="Last Name">
    <input class="email" type="text" placeholder="Email">
    <button class="sign-up">Sign up</button>

    <h1>Request a ride now</h1>
    <input class="request-input" type="text" placeholder="Enter pickup location">
    <input class="request-input" type="text" placeholder="Enter destination">
    <button class="request-button">Request now</button>
    <button class="schedule-button">Schedule for later</button>
  </body>
</html>
